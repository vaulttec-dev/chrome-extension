<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: "Google Sans", Roboto, system-ui, sans-serif;
        width: 300px;
        margin: 0;
        padding: 14px;
        color: #202124;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      #status {
        font-size: 13px;
        margin: 0 0 12px;
        color: #5f6368;
        min-height: 18px;
      }
      button {
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }
      #savekey { background: #1a73e8; color: #fff; }
      .hint { font-size: 12px; color: #80868b; margin: 10px 0 0; }
      hr { border: 0; border-top: 1px solid #eceff1; margin: 14px 0 10px; }
      .ghdr { display: block; font-size: 13px; font-weight: 500; margin: 0 0 6px; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        font-size: 13px;
        margin: 0 0 8px;
        background: #fff;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Запис Meet → Drive</h1>
    <p id="status">—</p>

    <hr />
    <label class="ghdr" for="quality">Якість відео</label>
    <select id="quality">
      <option value="auto">Авто — під потужність комп'ютера</option>
      <option value="1080">1080p — найчіткіше (≈2,2 ГБ/год)</option>
      <option value="900">900p — компроміс (≈1,6 ГБ/год)</option>
      <option value="720">720p — найлегше (≈1,1 ГБ/год)</option>
    </select>
    <p id="qualityhint" class="hint"></p>

    <hr />
    <label class="ghdr" for="gkey">Gemini API-ключ (авто-конспект)</label>
    <input id="gkey" type="password" placeholder="Вставте ключ і натисніть «Зберегти»" autocomplete="off" />
    <button id="savekey">Зберегти ключ</button>
    <p id="keystate" class="hint"></p>

    <script src="popup.js"></script>
  </body>
</html>
